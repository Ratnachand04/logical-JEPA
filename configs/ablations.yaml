# ===========================================================================
# Ablation study definitions, consumed by run_ablations.py
#
# Inherits every default from loco.yaml; each arm below lists only the keys it
# changes, so the arms differ in exactly one factor and nothing else.
# ===========================================================================

_base_: loco.yaml

experiment:
  name: ablation_study

# Shorter schedule than the headline run: four masking arms plus the scoring
# sweep is a lot of training, and the ranking between arms stabilises well
# before the absolute numbers do.
train:
  epochs: 80
  warmup_epochs: 8

ablation:
  # ---------------------------------------------------------------- #
  # Study 1 -- masking strategy (requires training one model per arm)
  #
  # Hypothesis: small masks favour structural anomalies, large masks favour
  # logical ones, and multi-scale beats both on the combined metric.
  # ---------------------------------------------------------------- #
  masking:
    - name: exp1_random_patch
      description: Scattered individual patches (MAE-style control)
      overrides:
        masking.strategy: random_patch
        masking.mask_ratio: 0.20

    - name: exp2_small_only
      description: Small 2x2-3x3 blocks only
      overrides:
        masking.strategy: small
        masking.num_small_only_targets: 6

    - name: exp3_large_only
      description: Large 5x5-8x8 blocks only
      overrides:
        masking.strategy: large
        masking.num_large_only_targets: 2

    - name: exp4_multiscale
      description: Proposed multi-scale contextual masking
      overrides:
        masking.strategy: multiscale
        masking.mode: mixed
        masking.num_small_targets: 3
        masking.num_large_targets: 1

    - name: exp5_multiscale_curriculum
      description: Multi-scale with a small-to-large curriculum
      overrides:
        masking.strategy: multiscale
        masking.mode: curriculum

  # ---------------------------------------------------------------- #
  # Study 2 -- anomaly score function (inference only, no retraining)
  #
  # Method A/B/C from the project plan. These re-score an already-trained
  # checkpoint, so the whole study costs one evaluation pass per row.
  # ---------------------------------------------------------------- #
  scoring:
    - name: score_cosine
      description: "Method B: 1 - cos(Zt, Zt_hat)"
      overrides:
        anomaly.distance: cosine

    - name: score_l2
      description: "Method A: ||Zt - Zt_hat||_2"
      overrides:
        anomaly.distance: l2

    - name: score_combined_a07
      description: "Method C: 0.7*cosine + 0.3*L2"
      overrides:
        anomaly.distance: combined
        anomaly.alpha: 0.7

    - name: score_combined_a05
      description: "Method C: equal cosine/L2 mixture"
      overrides:
        anomaly.distance: combined
        anomaly.alpha: 0.5

    - name: score_smooth_l1
      description: Huber distance in latent space
      overrides:
        anomaly.distance: smooth_l1

  # ---------------------------------------------------------------- #
  # Study 3 -- inference sweep configuration (inference only)
  #
  # Tests the claim that the *evaluation* scale matters independently of the
  # training scale: a model trained multi-scale should still lose logical
  # sensitivity if it is only swept with small windows.
  # ---------------------------------------------------------------- #
  sweep:
    - name: sweep_small_only
      description: Sweep with 2x2 windows only
      overrides:
        anomaly.sweep_windows: [2]

    - name: sweep_large_only
      description: Sweep with 6x6 windows only
      overrides:
        anomaly.sweep_windows: [6]

    - name: sweep_multi
      description: Multi-scale sweep (2, 4, 6)
      overrides:
        anomaly.sweep_windows: [2, 4, 6]

    - name: sweep_multi_max
      description: Multi-scale sweep fused with max instead of mean
      overrides:
        anomaly.sweep_windows: [2, 4, 6]
        anomaly.fusion: max

    - name: sweep_multi_weighted
      description: Multi-scale sweep biased towards the logical (large) scale
      overrides:
        anomaly.sweep_windows: [2, 4, 6]
        anomaly.fusion: weighted
        anomaly.scale_weights: {2: 1.0, 4: 1.5, 6: 2.5}

  # ---------------------------------------------------------------- #
  # Study 4 -- grid normalisation (inference only)
  #
  # A genuine trade-off, not a tuning knob. `global` divides out the
  # position-dependent baseline difficulty measured on normal images and is
  # what makes image-level detection work. The per-image modes produce
  # sharper localisation but destroy between-image comparability, so image
  # AUROC collapses towards chance while pixel AUROC stays high. Report both.
  # ---------------------------------------------------------------- #
  normalization:
    - name: norm_global
      description: Per-position statistics fitted on normal images (proposed)
      overrides:
        anomaly.normalize: global

    - name: norm_zscore
      description: Per-image z-score (sharp localisation, weak image detection)
      overrides:
        anomaly.normalize: zscore

    - name: norm_median
      description: Per-image median/MAD, robust to a few extreme patches
      overrides:
        anomaly.normalize: median

    - name: norm_none
      description: Raw error, no normalisation at all
      overrides:
        anomaly.normalize: none

  # ---------------------------------------------------------------- #
  # Study 5 -- loss reduction (requires training one model per arm)
  #
  # Study 1's failure has two candidate explanations. This isolates the first:
  # under `per_patch`, one 6x6 block (36 patches) outweighs three small blocks
  # (~19 patches) roughly 2:1, so `multiscale` effectively trained on its
  # large-scale objective alone. `per_block` removes exactly that asymmetry and
  # changes nothing else.
  #
  # Reading the result:
  #   multiscale improves and closes the gap -> loss weighting was the cause
  #   multiscale still loses                 -> the second explanation (anomaly
  #                                             scale vs block size) leads, and
  #                                             the next experiment is block-size
  #                                             ranges, not loss weighting
  # ---------------------------------------------------------------- #
  loss_reduction:
    - name: red_multiscale_per_patch
      description: Multi-scale masking, per-patch weighting (Study 1 baseline)
      overrides:
        masking.strategy: multiscale
        masking.mode: mixed
        loss.reduction: per_patch

    - name: red_multiscale_per_block
      description: Multi-scale masking, per-block weighting (the fix under test)
      overrides:
        masking.strategy: multiscale
        masking.mode: mixed
        loss.reduction: per_block

    - name: red_random_patch_per_block
      description: Control -- the winning arm is single-scale, so per_block must not move it
      overrides:
        masking.strategy: random_patch
        loss.reduction: per_block

    - name: red_random_patch_per_patch
      description: Control -- the Study 1 winner, unchanged
      overrides:
        masking.strategy: random_patch
        loss.reduction: per_patch

  # ---------------------------------------------------------------- #
  # Study 6 -- VICReg collapse regulariser (trains one model per arm)
  #
  # These terms are a safety net, not an objective. The question is not "does
  # VICReg raise AUROC" -- it is "can non-collapse be guaranteed without paying
  # for it in representation quality". Read `target_std` and `dead_dim_frac`
  # alongside the metrics: if AUROC drops while those improve, the weights are
  # too high and the regulariser is fighting the predictive loss.
  # ---------------------------------------------------------------- #
  vicreg:
    - name: vicreg_off
      description: Baseline -- watch-and-warn only, no regularisation
      overrides:
        regularizer.vicreg.enabled: false

    - name: vicreg_low
      description: Low weight -- the intended safety-net setting
      overrides:
        regularizer.vicreg.enabled: true
        regularizer.vicreg.var_weight: 1.0
        regularizer.vicreg.cov_weight: 0.04

    - name: vicreg_high
      description: Deliberately over-weighted, to show the cost of over-regularising
      overrides:
        regularizer.vicreg.enabled: true
        regularizer.vicreg.var_weight: 10.0
        regularizer.vicreg.cov_weight: 1.0

    - name: vicreg_var_only
      description: Variance term alone -- isolates what the covariance term adds
      overrides:
        regularizer.vicreg.enabled: true
        regularizer.vicreg.var_weight: 1.0
        regularizer.vicreg.cov_weight: 0.0

  # ---------------------------------------------------------------- #
  # Study 7 -- signed vs absolute deviation (inference only)
  #
  # Motivated by a measured failure, not a hunch: on real LOCO pushpins the
  # signed score put logical anomalies BELOW chance (0.449 +/- 0.003 over 3
  # seeds). A missing object makes its region easier to predict, so signed
  # scoring ranks it as more normal than normal.
  #
  # Reading the result:
  #   absolute lifts logical AUROC above 0.5 -> the mechanism is confirmed and
  #                                             "anomaly == unpredictable" is
  #                                             the wrong prior for missing
  #                                             objects
  #   absolute does not help                 -> the below-chance result has a
  #                                             different cause and the next
  #                                             step is per-defect-type analysis
  # ---------------------------------------------------------------- #
  deviation:
    - name: dev_signed
      description: Only harder-than-normal counts (current default)
      overrides:
        anomaly.deviation: signed

    - name: dev_absolute
      description: "|z| -- an unexpectedly easy region counts as surprise too"
      overrides:
        anomaly.deviation: absolute

    - name: dev_absolute_max
      description: Absolute deviation fused with max across scales
      overrides:
        anomaly.deviation: absolute
        anomaly.fusion: max

  # ---------------------------------------------------------------- #
  # Study 8 -- hierarchical slot loss (Phase 3b; trains one model per arm)
  #
  # Every arm trains the slot module and the cardinality head, so they differ
  # ONLY in lambda. `hier_lambda_0` is the control: slot stage present, slot
  # term logged but not trained on -- its JEPA is the plain JEPA, since the
  # slot module and head receive only detached inputs.
  #
  # Reading the result:
  #   logical AUROC rises with lambda   -> set-level consistency helps the
  #                                        predictor reason about composition
  #   flat within seed noise            -> the patch term already carries it
  #   falls with lambda                 -> the slot term fights the patch term
  # Read `loss_hier` in the training log alongside: if it does not fall as
  # lambda rises, the term is not being optimised at all.
  # ---------------------------------------------------------------- #
  hierarchical:
    - name: hier_lambda_0
      description: Control -- slot stage trained, slot term weight 0
      overrides:
        slots.enabled: true
        slots.hierarchical_weight: 0.0

    - name: hier_lambda_0.1
      description: Slot term at lambda 0.1
      overrides:
        slots.enabled: true
        slots.hierarchical_weight: 0.1

    - name: hier_lambda_0.5
      description: Slot term at lambda 0.5
      overrides:
        slots.enabled: true
        slots.hierarchical_weight: 0.5

    - name: hier_lambda_2
      description: Deliberately over-weighted slot term
      overrides:
        slots.enabled: true
        slots.hierarchical_weight: 2.0

  # ---------------------------------------------------------------- #
  # Study 9 -- cardinality channel (Phase 3c; inference only)
  #
  # Re-scores the Study 8 control checkpoint. The question is Phase 1's:
  # does a direction-free, count-like score recover the REMOVAL anomalies that
  # signed latent error under-ranks? Read `removal_auroc` first; the synthetic
  # set labels every logical defect by direction.
  #
  # `dev_absolute` is included because it is the other fix for the same
  # failure (Study 7) -- the two should be compared, not assumed to stack.
  # ---------------------------------------------------------------- #
  cardinality:
    - name: card_off
      description: JEPA latent error only (signed)
      overrides:
        anomaly.cardinality: "off"
        anomaly.deviation: signed

    - name: card_dev_absolute
      description: JEPA with absolute deviation (Study 7 fix), no cardinality
      overrides:
        anomaly.cardinality: "off"
        anomaly.deviation: absolute

    - name: card_only
      description: Cardinality channel alone
      overrides:
        anomaly.cardinality: only

    - name: card_add
      description: JEPA (signed) + cardinality
      overrides:
        anomaly.cardinality: add
        anomaly.deviation: signed

    - name: card_add_absolute
      description: JEPA (absolute) + cardinality
      overrides:
        anomaly.cardinality: add
        anomaly.deviation: absolute
